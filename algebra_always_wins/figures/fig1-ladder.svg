<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 802" width="100%" role="img" style="background:#fbf9f4">
<style>
  .t { font-family:Iowan Old Style, Palatino, Georgia, serif; fill:#191714; }
  .m { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#6f675c; }
  .cap { font-family:Iowan Old Style, Palatino, Georgia, serif; fill:#6f675c; font-style:italic; }
</style>
<rect width="1000" height="802" fill="#fbf9f4"/>
<text class="t" x="48" y="46" font-size="21" font-weight="600">The ladder: seven vocabularies, seven casualties</text>
<text class="cap" x="48" y="70" font-size="13.5">A rung counts as a level only if something dies crossing it.</text>
<line x1="30" y1="94" x2="30" y2="720" stroke="#d9d2c3" stroke-width="2"/>
<path d="M25,714 l5,10 l5,-10" fill="none" stroke="#d9d2c3" stroke-width="2"/>
<text class="cap" x="0" y="0" font-size="12" text-anchor="middle" transform="translate(14,412.0) rotate(-90)">lowering</text>
<rect x="48" y="104" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="104" width="46" height="78" rx="9" fill="#b45309" opacity="0.10"/>
<text class="m" x="71" y="138" font-size="15" text-anchor="middle" fill="#b45309">0</text>
<text class="t" x="114" y="134" font-size="16.5" font-weight="600">model</text>
<text class="m" x="114" y="156" font-size="12">tensors · modules · autograd · heads</text>
<line x1="518" y1="118" x2="518" y2="168" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="130" font-size="10.5" letter-spacing="1.1" fill="#b45309">WHAT BREAKS</text>
<text class="t" x="538" y="151" font-size="13.2" fill="#6f675c">tracing: control flow, aliasing, data-dependent shapes</text>
<rect x="48" y="196" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="196" width="46" height="78" rx="9" fill="#b45309" opacity="0.10"/>
<text class="m" x="71" y="230" font-size="15" text-anchor="middle" fill="#b45309">1</text>
<text class="t" x="114" y="226" font-size="16.5" font-weight="600">graph IR</text>
<text class="m" x="114" y="248" font-size="12">dot_general · reduce · exp · transpose</text>
<line x1="518" y1="210" x2="518" y2="260" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="222" font-size="10.5" letter-spacing="1.1" fill="#b45309">WHAT BREAKS</text>
<text class="t" x="538" y="243" font-size="13.2" fill="#6f675c">fusion decisions, layout, guards, recompiles</text>
<rect x="48" y="288" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="288" width="46" height="78" rx="9" fill="#9f1239" opacity="0.10"/>
<text class="m" x="71" y="322" font-size="15" text-anchor="middle" fill="#9f1239">2</text>
<text class="t" x="114" y="318" font-size="16.5" font-weight="600">structured ops</text>
<text class="m" x="114" y="340" font-size="12">linalg.matmul · linalg.generic · affine maps</text>
<line x1="518" y1="302" x2="518" y2="352" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="314" font-size="10.5" letter-spacing="1.1" fill="#9f1239">WHAT BREAKS</text>
<text class="t" x="538" y="335" font-size="13.2" fill="#6f675c">the name — 'matmul' becomes an index space</text>
<rect x="48" y="380" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="380" width="46" height="78" rx="9" fill="#9f1239" opacity="0.10"/>
<text class="m" x="71" y="414" font-size="15" text-anchor="middle" fill="#9f1239">3</text>
<text class="t" x="114" y="410" font-size="16.5" font-weight="600">loops &amp; buffers</text>
<text class="m" x="114" y="432" font-size="12">scf.for · scf.forall · memref.subview</text>
<line x1="518" y1="394" x2="518" y2="444" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="406" font-size="10.5" letter-spacing="1.1" fill="#9f1239">WHAT BREAKS</text>
<text class="t" x="538" y="427" font-size="13.2" fill="#6f675c">value semantics — tensors become addresses</text>
<rect x="48" y="472" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="472" width="46" height="78" rx="9" fill="#9f1239" opacity="0.10"/>
<text class="m" x="71" y="506" font-size="15" text-anchor="middle" fill="#9f1239">4</text>
<text class="t" x="114" y="502" font-size="16.5" font-weight="600">vector / GPU</text>
<text class="m" x="114" y="524" font-size="12">vector.contract · nvgpu.mma.sync</text>
<line x1="518" y1="486" x2="518" y2="536" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="498" font-size="10.5" letter-spacing="1.1" fill="#9f1239">WHAT BREAKS</text>
<text class="t" x="538" y="519" font-size="13.2" fill="#6f675c">shape — a 16×16 tile becomes a fragment layout</text>
<rect x="48" y="564" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="564" width="46" height="78" rx="9" fill="#1d4e6f" opacity="0.10"/>
<text class="m" x="71" y="598" font-size="15" text-anchor="middle" fill="#1d4e6f">5</text>
<text class="t" x="114" y="594" font-size="16.5" font-weight="600">ISA</text>
<text class="m" x="114" y="616" font-size="12">mma.sync · wgmma · HMMA.16816</text>
<line x1="518" y1="578" x2="518" y2="628" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="590" font-size="10.5" letter-spacing="1.1" fill="#1d4e6f">WHAT BREAKS</text>
<text class="t" x="538" y="611" font-size="13.2" fill="#6f675c">the compiler — scheduling, registers, occupancy</text>
<rect x="48" y="656" width="904" height="78" rx="9" fill="#fffefb" stroke="#d9d2c3"/>
<rect x="48" y="656" width="46" height="78" rx="9" fill="#1d4e6f" opacity="0.10"/>
<text class="m" x="71" y="690" font-size="15" text-anchor="middle" fill="#1d4e6f">6</text>
<text class="t" x="114" y="686" font-size="16.5" font-weight="600">silicon</text>
<text class="m" x="114" y="708" font-size="12">D += A·B on a fixed grid</text>
<line x1="518" y1="670" x2="518" y2="720" stroke="#d9d2c3" stroke-dasharray="3 4"/>
<text class="m" x="538" y="682" font-size="10.5" letter-spacing="1.1" fill="#1d4e6f">WHAT BREAKS</text>
<text class="t" x="538" y="703" font-size="13.2" fill="#6f675c">nothing. the substrate's own limit is bytes/joule</text>
<text class="cap" x="48" y="784" font-size="12">Left column: what you can still say. Right column: what stops being true. The bottom two rungs are not printed by any compiler.</text>
</svg>
